name: Build and package the Globe plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Klona repot
        uses: actions/checkout@v7

      - name: Sätt upp Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Installera beroenden
        run: npm install

      - name: Bygg projektet
        run: npm run build

      - name: Packa artefakter (build)
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
